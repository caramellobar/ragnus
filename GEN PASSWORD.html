
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#10172a,#263b60);
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}

.app {
  width: 100%;
  max-width: 440px;
  padding: 30px;
  background: #1d2940;
  border: 1px solid #394b69;
  border-radius: 20px;
  box-shadow: 0 20px 60px #0006;
}

h1 { text-align: center; margin-top: 0; }
.subtitle { text-align: center; color: #aab8cf; }

.password {
  margin: 25px 0;
  padding: 18px 12px;
  background: #101a2d;
  border: 1px solid #526582;
  border-radius: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
}

#result {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 19px;
  color: #70e5b1;
  text-align: center;
  font-weight: bold;
}

button {
  border: 0;
  padding: 13px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: bold;
}

.copy { background: #354765; color: white; }

label {
  display: block;
  margin: 17px 0 8px;
  color: #dce5f4;
}

input[type=range] { width: 100%; accent-color: #55dba4; }

select {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  background: #101a2d;
  color: white;
  border: 1px solid #526582;
}

.check {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0;
}

.check input { accent-color: #55dba4; }

.generate {
  width: 100%;
  margin-top: 25px;
  background: #55dba4;
  color: #10271f;
  font-size: 16px;
  padding: 16px;
}

.generate:hover { background: #76edbc; }

#message {
  text-align: center;
  color: #70e5b1;
  min-height: 20px;
  margin-top: 14px;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="app">
  <h1>🔐 Password Generator</h1>
  <p class="subtitle">Crea password sicure e facili da ricordare</p>

  <div class="password">
    <span id="result">Premi Genera</span>
    <button class="copy" onclick="copyPassword()">📋</button>
  </div>

  <label>Lunghezza: <strong id="lengthValue">16</strong></label>
  <input type="range" id="length" min="8" max="40" value="16"
         oninput="lengthValue.textContent=this.value">

  <label>Tipo di password</label>
  <select id="mode">
    <option value="pronounceable">Pronunciabile</option>
    <option value="random">Completamente casuale</option>
  </select>

  <div class="check">
    <input type="checkbox" id="numbers" checked>
    <label for="numbers">Includi numeri</label>
  </div>

  <div class="check">
    <input type="checkbox" id="symbols" checked>
    <label for="symbols">Includi simboli (!@#$%)</label>
  </div>

  <div class="check">
    <input type="checkbox" id="uppercase" checked>
    <label for="uppercase">Includi maiuscole</label>
  </div>

  <button class="generate" onclick="generatePassword()">
    ✨ GENERA PASSWORD
  </button>

  <p id="message"></p>
</div>

<script>
function secureIndex(max) {
  const limit = Math.floor(4294967296 / max) * max;
  const array = new Uint32Array(1);
  let value;
  do {
    crypto.getRandomValues(array);
    value = array[0];
  } while (value >= limit);
  return value % max;
}

function pick(chars) {
  return chars[secureIndex(chars.length)];
}

function pronounceable(length, numbers, symbols, uppercase) {
  const consonants = "bcdfghjklmnprstvz";
  const vowels = "aeiou";
  let password = "";

  while (password.length < length) {
    password += pick(consonants) + pick(vowels);
  }

  password = password.slice(0, length);

  if (numbers && password.length >= 2) {
    const pos = secureIndex(password.length);
    password = password.slice(0,pos) +
      pick("23456789") + password.slice(pos+1);
  }

  if (symbols && password.length >= 3) {
    const pos = secureIndex(password.length);
    password = password.slice(0,pos) +
      pick("!@#$%&*?") + password.slice(pos+1);
  }

  if (uppercase) {
    const pos = secureIndex(password.length);
    password = password.slice(0,pos) +
      password[pos].toUpperCase() + password.slice(pos+1);
  }

  return password;
}

function randomPassword(length, numbers, symbols, uppercase) {
  let chars = "abcdefghijklmnopqrstuvwxyz";
  if (uppercase) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  if (numbers) chars += "0123456789";
  if (symbols) chars += "!@#$%&*?";

  return Array.from({length}, () => pick(chars)).join("");
}

function generatePassword() {
  const length = Number(document.getElementById("length").value);
  const numbers = document.getElementById("numbers").checked;
  const symbols = document.getElementById("symbols").checked;
  const uppercase = document.getElementById("uppercase").checked;
  const mode = document.getElementById("mode").value;

  const password = mode === "pronounceable"
    ? pronounceable(length, numbers, symbols, uppercase)
    : randomPassword(length, numbers, symbols, uppercase);

  document.getElementById("result").textContent = password;
  document.getElementById("message").textContent =
    "✓ Nuova password generata!";
}

async function copyPassword() {
  const password = document.getElementById("result").textContent;

  if (password === "Premi Genera") return;

  try {
    await navigator.clipboard.writeText(password);
    document.getElementById("message").textContent =
      "✓ Password copiata!";
  } catch {
    document.getElementById("message").textContent =
      "Impossibile copiare: seleziona la password manualmente.";
  }
}

generatePassword();
</script>

</body>
</html>
